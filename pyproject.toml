[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "novamart-multi-agent-support"
version = "0.1.0"
description = "Production-oriented multi-agent customer support system on Amazon Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "strands-agents>=1.55,<2.0",
    "bedrock-agentcore>=0.1,<1.0",
    "boto3>=1.40,<2.0",
    "botocore>=1.40,<2.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "python-dotenv>=1.1,<2.0",
    "structlog>=25.4,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "pytest-cov>=6.2,<7.0",
    "moto[dynamodb,s3]>=5.1,<6.0",
    "ruff>=0.12,<1.0",
    "mypy>=1.17,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/novamart_support"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["novamart_support"]
